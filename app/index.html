<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4fae8a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>小学语文字帖生成器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="view active" id="p-set">
  <div class="top">
    <div class="logo" aria-hidden="true">字</div>
    <div><h1>汉字字帖</h1><small>选好内容，一键生成练习页</small></div>
    <div class="step">① 设置</div>
  </div>
  <div class="body">
    <div class="field">
      <label id="grade-label">年级</label>
      <div class="grades" id="grades" role="group" aria-labelledby="grade-label"></div>
    </div>
    <div class="two">
      <div class="field">
        <label id="term-label">学期</label>
        <div class="seg" id="term" role="group" aria-labelledby="term-label">
          <button type="button" data-v="1" class="on">上学期</button>
          <button type="button" data-v="2">下学期</button>
        </div>
      </div>
      <div class="field">
        <label for="unit">单元</label>
        <select id="unit"></select>
      </div>
    </div>
    <div class="field name-field">
      <label for="name">姓名 <span class="opt">（将显示在页眉，并按字生成练习行）</span></label>
      <select id="name" class="pending">
        <option value="">请选择姓名</option>
      </select>
    </div>
    <div class="pv" id="pv"></div>
  </div>
  <div class="dock noprint">
    <button class="cta" id="go" type="button">确认生成</button>
    <p class="note">打印将打开系统打印（含 AirPrint）。保存为 PDF 请在打印对话框里选择“另存为 PDF”。网页无法静默直连局域网打印机。</p>
  </div>
</section>

<section class="view" id="p-res">
  <div class="top noprint">
    <button class="back" id="back" type="button">返回设置</button>
    <div class="step">② 预览 · A4</div>
  </div>
  <div class="r-body">
    <p class="r-tip noprint" id="rtip"></p>
    <main id="pages" class="pages"></main>
  </div>
  <div class="dock noprint">
    <div class="actions">
      <button class="abtn p" id="print" type="button">打印<small>系统打印 / AirPrint</small></button>
      <button class="abtn s" id="pdf" type="button">保存为PDF<small>在打印对话框选“另存为PDF”</small></button>
    </div>
    <p class="note">保存为 PDF 会打开同一个系统打印对话框，请在其中选择“另存为 PDF”。</p>
  </div>
</section>
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>
<script type="module" src="app.js"></script>
</body>
</html>
