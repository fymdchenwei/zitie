# 把 app/ 的全部内容作为站点根部署到 GitHub Pages（项目站点 /zitie/），
# 并把仓库根目录的 mockup-v2/ 原样放到站点子路径 /mockup-v2/。
name: Deploy static content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/mockup-v2
          cp -a app/. _site/
          cp -a mockup-v2/. _site/mockup-v2/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
